name: Verify Music DNA learning lifecycle
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/musicdna/learning/**'
      - 'src/musicdna/contracts/**'
      - 'src/musicdna/adapters/learning-withdrawal.ts'
      - 'contracts/**'
      - 'scripts/check-musicdna*'
      - 'supabase/migrations/*musicdna_synthetic_learning_lifecycle.sql'
      - 'package*.json'
      - '.github/workflows/learning-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'src/musicdna/learning/**'
      - 'src/musicdna/contracts/**'
      - 'src/musicdna/adapters/learning-withdrawal.ts'
      - 'contracts/**'
      - 'scripts/check-musicdna*'
      - 'supabase/migrations/*musicdna_synthetic_learning_lifecycle.sql'
      - 'package*.json'
      - '.github/workflows/learning-lifecycle.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx eslint src/musicdna/learning src/musicdna/adapters/learning-withdrawal.ts
      - run: npm run build
        env:
          VERCEL: '1'
          VERCEL_ENV: production
