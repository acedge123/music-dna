name: Verify Music DNA learning lifecycle
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/musicdna/learning/**'
      - 'src/musicdna/contracts/**'
      - 'src/musicdna/adapters/learning-*.ts'
      - 'contracts/**'
      - 'scripts/check-musicdna*'
      - 'scripts/require-learning-outbox-db.*'
      - 'supabase/migrations/**'
      - 'docs/musicdna/learning-lifecycle-migration-receipt.json'
      - 'package*.json'
      - '.github/workflows/learning-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'src/musicdna/learning/**'
      - 'src/musicdna/contracts/**'
      - 'src/musicdna/adapters/learning-*.ts'
      - 'contracts/**'
      - 'scripts/check-musicdna*'
      - 'scripts/require-learning-outbox-db.*'
      - 'supabase/migrations/**'
      - 'docs/musicdna/learning-lifecycle-migration-receipt.json'
      - 'package*.json'
      - '.github/workflows/learning-lifecycle.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      outbox-db:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ab45-local-test
          POSTGRES_DB: ab45_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:learning-outbox
        env:
          AB45_TEST_DATABASE_URL: postgres://postgres:ab45-local-test@127.0.0.1:5432/ab45_test
      - run: npx tsc --noEmit
      - run: npx eslint src/musicdna/learning src/musicdna/adapters/learning-*.ts
      - run: npm run build
        env:
          VERCEL: '1'
          VERCEL_ENV: production
