publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  google_fonts: ^6.3.1
  go_router: ^16.0.0
